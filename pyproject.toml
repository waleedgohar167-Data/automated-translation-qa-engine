[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "automated-translation-qa-engine"
version = "0.1.0"
description = "Deterministic quality checks for source and translated text"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
translation-qa = "translation_qa.cli:main"

[tool.setuptools.packages.find]
include = ["translation_qa*"]
